<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#05070f;font-family:"DejaVu Sans",sans-serif;color:#eef1ff}
.bg{position:absolute;inset:0;background:
 radial-gradient(40% 60% at 15% 25%,rgba(124,124,255,.28),transparent 70%),
 radial-gradient(40% 55% at 85% 20%,rgba(47,212,245,.22),transparent 70%),
 radial-gradient(35% 50% at 60% 95%,rgba(177,140,255,.2),transparent 70%)}
.in{position:absolute;inset:70px 80px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;align-items:center;gap:20px}
.mark{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#7c7cff,#b18cff 48%,#2fd4f5);display:grid;place-items:center}
.name{font-size:34px;font-weight:700}
.eye{font-size:22px;letter-spacing:.2em;color:#b3b7ff;text-transform:uppercase;font-weight:700;margin-top:20px}
h1{margin:0;font-size:76px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
h1 span{background:linear-gradient(135deg,#7c7cff,#b18cff 48%,#2fd4f5);-webkit-background-clip:text;color:transparent}
.row{display:flex;gap:16px;margin-top:auto}
.pill{border:1px solid #2a3560;background:#0b0f1e;border-radius:999px;padding:14px 26px;font-size:24px;color:#a3adcf}
.pill b{color:#eef1ff}
</style></head><body><div class="bg"></div><div class="in">
<div class="top"><div class="mark"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 L21 19 L3 19 Z"/><path d="M12 10 L16.5 19 L7.5 19 Z" opacity=".55"/></svg></div><div class="name">Trilogy Trading Tools</div></div>
<div class="eye">For small-cap momentum traders</div>
<h1>Find the move. Prove your edge.<br><span>Keep what you make.</span></h1>
<div class="row"><div class="pill"><b>3T Pro Scanner</b></div><div class="pill"><b>Trilogy Journal</b></div><div class="pill"><b>Wealth Builder</b></div><div class="pill">Prices in CAD</div></div>
</div></body></html>
